var copy=function(k){return (T[lang]||T.en)[k]||T.en[k]||k};

function money(n){return '$'+Number(n||0).toFixed(2)}
function originalName(d){return lang==='en'?'':(d.names.en||d.native[lang])}
function itemCount(){return items.reduce(function(a,x){return a+x.qty},0)}
function subtotal(){return items.reduce(function(a,x){return a+x.dish.price*x.qty},0)}
function tax(){return subtotal()*taxRate/100}
function tipRate(){return selectedTip==='custom'?customTip:Number(selectedTip)}
function tipAmount(){return subtotal()*tipRate()/100}
function total(){return subtotal()+tax()+tipAmount()}
function itemInOrder(id){return items.find(function(x){return x.dish.id===id})}

function orderScreen(){var rows=items.map(function(x){return '<div class="order-item"><span class="thumb-sm">'+x.dish.emoji+'</span><span class="order-item-info"><strong>'+esc(x.dish.names[lang])+'</strong><span>'+(lang==='en'?'':esc(originalName(x.dish))+' · ')+money(x.dish.price)+'</span></span><span class="qty"><button data-qty="'+x.dish.id+'" data-delta="-1" aria-label="−">−</button><strong>'+x.qty+'</strong><button data-qty="'+x.dish.id+'" data-delta="1" aria-label="+">+</button></span><strong class="order-item-price">'+money(x.dish.price*x.qty)+'</strong><button class="btn-quiet" data-remove="'+x.dish.id+'" aria-label="'+copy('remove')+'">×</button></div>'}).join('');return '<div class="page-grid no-aside"><section><button class="back-link" data-back-menu>← '+copy('back')+' '+copy('menuTitle')+'</button><div class="eyebrow">'+copy('step6')+'</div><h2>'+copy('yourOrder')+'</h2><p class="lede">'+copy('menuText')+'</p><div class="panel summary">'+(rows||'<div class="empty-order">'+copy('emptyOrder')+'</div>')+'<div class="summary-row"><span>'+copy('subtotal')+'</span><strong>'+money(subtotal())+'</strong></div><div class="tax-callout"><p><b>'+copy('estimatedTax')+' ('+taxRate+'%)</b><br>'+money(tax())+'</p><button class="question" data-tax-help aria-label="'+copy('taxHelp')+'">?</button></div><label class="tax-edit">'+copy('taxRate')+'<input type="number" min="0" max="20" step="0.1" id="taxInput" value="'+taxRate+'" aria-label="'+copy('taxRate')+'">%</label><div class="summary-row total"><span>'+copy('estimatedTotal')+'<small>('+copy('withoutTip')+')</small></span><strong>'+money(subtotal()+tax())+'</strong></div><button class="info-link" data-tax-help><span>?</span>'+copy('taxHelp')+'</button><button class="btn btn-primary btn-wide" data-continue-tip '+(items.length?'':'disabled')+'>'+copy('continueTip')+'</button></div></section></div>'}
function tipScreen(){var percents=[15,18,20],rows=percents.map(function(p){return '<button class="tip-option '+(selectedTip===p?'active':'')+'" data-tip="'+p+'"><strong>'+(selectedTip===p?'• ':'')+p+'%</strong><span>'+money(subtotal()*p/100)+'</span></button>'}).join('');return '<div class="page-grid no-aside"><section><button class="back-link" data-back-order>← '+copy('back')+'</button><div class="eyebrow">'+copy('step7')+'</div><h2>'+copy('tipTitle')+'</h2><p class="lede">'+copy('tipText')+'</p><div class="panel summary"><div class="tip-list">'+rows+'<label class="tip-option custom '+(selectedTip==='custom'?'active':'')+'"><strong>'+copy('custom')+'</strong><input type="number" min="0" max="100" step="1" id="customTipInput" value="'+customTip+'" aria-label="'+copy('custom')+'"><span>'+money(subtotal()*customTip/100)+'</span></label><button class="tip-option '+(selectedTip===0?'active':'')+'" data-tip="0"><strong>'+copy('noTip')+'</strong><span>'+money(0)+'</span></button></div><button class="info-link" data-tip-help><span>?</span>'+copy('tipHelp')+'</button><div class="summary-row"><span>'+copy('subtotal')+'</span><strong>'+money(subtotal())+'</strong></div><div class="summary-row"><span>'+copy('estimatedTax')+'</span><strong>'+money(tax())+'</strong></div><button class="btn btn-primary btn-wide" data-see-total>'+copy('seeTotal')+'</button></div></section></div>'}
function summaryScreen(){var rows=items.map(function(x){return '<div class="summary-row"><span>'+esc(x.dish.names[lang])+'<small>'+(lang==='en'?'':esc(originalName(x.dish))+' · ')+x.qty+' × '+money(x.dish.price)+'</small></span><strong>'+money(x.dish.price*x.qty)+'</strong></div>'}).join('');return '<div class="page-grid no-aside"><section><button class="back-link" data-back-tip>← '+copy('back')+'</button><div class="eyebrow">'+copy('step8')+'</div><h2>'+copy('summaryTitle')+'</h2><div class="panel summary">'+rows+'<div class="summary-row"><span>'+copy('subtotal')+'</span><strong>'+money(subtotal())+'</strong></div><div class="summary-row"><span>'+copy('estimatedTax')+' ('+taxRate+'%)</span><strong>'+money(tax())+'</strong></div><div class="summary-row"><span>'+copy('tip')+' ('+tipRate()+'%)</span><strong>'+money(tipAmount())+'</strong></div><div class="summary-row total"><span>'+copy('totalPayment')+'</span><strong>'+money(total())+'</strong></div><button class="btn btn-primary btn-wide" data-done>'+copy('done')+'</button></div></section></div>'}
function confirmationScreen(){return '<div class="page-grid no-aside"><section class="panel confirm"><div class="checkmark">✓</div><div class="eyebrow">'+copy('step9')+'</div><h1>'+copy('confirm')+'</h1><p class="lede">'+copy('confirmText')+'</p><div class="summary-row total" style="max-width:340px;margin:0 auto 20px"><span>'+copy('totalPayment')+'</span><strong>'+money(total())+'</strong></div><button class="btn btn-dark" data-back-menu>'+copy('backMenu')+'</button></section></div>'}
function render(){document.title='DineWise — '+copy('tag');updateHeader();var html=step===1?welcomeScreen():step===2?scanScreen():step===3?languageScreen():step===4?menuScreen():step===5?detailScreen():step===6?orderScreen():step===7?tipScreen():step===8?summaryScreen():confirmationScreen();document.getElementById('app').innerHTML=html;document.getElementById('globalLanguage').value=lang;if(modal)renderModal()}
function renderModal(){var root=document.getElementById('modalRoot');if(!modal){root.innerHTML='';return}var title=modal==='tax'?copy('taxHelp'):copy('tipHelp');var body=modal==='tax'?'<p>'+copy('taxExplain')+'</p><div class="tax-callout"><p><b>'+copy('example')+'</b><br>$20.00 × 8% = $1.60</p></div>':'<p>'+copy('tipExplain')+'</p>';root.innerHTML='<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><button class="modal-x" data-close-modal aria-label="'+copy('gotIt')+'">×</button><h3>'+title+'</h3>'+body+'<button class="btn btn-dark" data-close-modal>'+copy('gotIt')+'</button></section></div>'}
function loadOCR(){if(window.Tesseract)return Promise.resolve(window.Tesseract);if(!window.ocrPromise){window.ocrPromise=new Promise(function(resolve,reject){var script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';script.onload=function(){resolve(window.Tesseract)};script.onerror=function(){reject(new Error('OCR unavailable'))};document.head.appendChild(script)})}return window.ocrPromise}
function scannedDish(entry,index){var known=dishes.find(function(d){var a=entry.name.toLowerCase(),b=d.names.en.toLowerCase();return a.indexOf(b)>-1||b.indexOf(a)>-1||a.indexOf(d.id)>-1});if(known)return Object.assign({},known,{id:'scan-'+index,price:entry.price});var n={en:entry.name,'zh-CN':entry.name,es:entry.name,ja:entry.name,ko:entry.name,fr:entry.name};var descriptions={en:'Dish name read from your photo. Ask the restaurant to confirm the ingredients.', 'zh-CN':'已读取照片中的菜名。请向餐厅确认具体食材。',es:'Nombre leído de la foto. Confirma los ingredientes con el restaurante.',ja:'写真から料理名を読み取りました。食材はお店に確認してください。',ko:'사진에서 음식 이름을 읽었습니다. 재료는 식당에 확인해 주세요.',fr:'Nom lu sur la photo. Demandez au restaurant de confirmer les ingrédients.'};var warns={en:['Ask restaurant','Confirm recipe','Check allergens'],'zh-CN':['询问餐厅','确认做法','确认过敏原'],es:['Consultar al restaurante','Confirmar receta','Revisar alérgenos'],ja:['店員に確認','レシピ確認','アレルゲン確認'],ko:['직원에게 확인','조리법 확인','알레르기 확인'],fr:['Demander au personnel','Confirmer la recette','Vérifier les allergènes']};return {id:'scan-'+index,cat:'mains',emoji:'🍽️',price:entry.price,names:n,native:{en:entry.name,'zh-CN':entry.name,es:entry.name,ja:entry.name,ko:entry.name,fr:entry.name},desc:descriptions,ingredients:warns,icon:['❔','🍴','⚠️']}}
function upload(file){if(!file)return;scanImageUrl=URL.createObjectURL(file);var status=document.getElementById('scanStatus');if(status)status.textContent=copy('processing');loadOCR().then(function(api){return api.createWorker('eng',1).then(function(worker){return worker.recognize(file).then(function(result){var found=[];result.data.text.split(/\n/).forEach(function(line){var m=line.match(/(.+?)\s+\$?(\d{1,3}(?:,\d{3})*(?:\.\d{2})?)\s*$/);if(m){var name=m[1].trim(),price=Number(m[2].replace(/,/g,''));if(name.length>2&&price>0)found.push({name:name,price:price})}});menuRecognized=found;activeDishes=found.length?found.map(scannedDish):dishes;return worker.terminate()}).catch(function(error){return worker.terminate().then(function(){throw error})})})}).catch(function(){activeDishes=dishes;toast(copy('scanError'))}).finally(function(){step=3;render()})}
function events(){var root=document.getElementById('app');root.onclick=function(e){var b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-open-scan')){setStep(2)}else if(b.hasAttribute('data-open-photos')){document.getElementById('photoInput').click()}else if(b.hasAttribute('data-back-home')){setStep(1)}else if(b.hasAttribute('data-back-scan')){setStep(2)}else if(b.hasAttribute('data-camera')){document.getElementById('cameraInput').click()}else if(b.hasAttribute('data-sample')){menuRecognized=[];scanImageUrl='';activeDishes=dishes;setStep(3)}else if(b.hasAttribute('data-continue-menu')){setStep(4)}else if(b.hasAttribute('data-pick-lang')){setLang(b.getAttribute('data-pick-lang'))}else if(b.hasAttribute('data-back-menu')){setStep(4)}else if(b.hasAttribute('data-rescan')){setStep(2)}else if(b.hasAttribute('data-dish')){selectedDish=activeDishes.find(function(d){return d.id===b.getAttribute('data-dish')});setStep(5)}else if(b.hasAttribute('data-add-detail')){addDish(selectedDish);setStep(6)}else if(b.hasAttribute('data-category')){category=b.getAttribute('data-category');render()}else if(b.hasAttribute('data-go-order')){setStep(6)}else if(b.hasAttribute('data-qty')){changeQty(b.getAttribute('data-qty'),Number(b.getAttribute('data-delta')))}else if(b.hasAttribute('data-remove')){removeDish(b.getAttribute('data-remove'))}else if(b.hasAttribute('data-tax-help')){modal='tax';renderModal()}else if(b.hasAttribute('data-tip-help')){modal='tip';renderModal()}else if(b.hasAttribute('data-close-modal')){modal=null;renderModal()}else if(b.hasAttribute('data-continue-tip')){selectedTip=18;setStep(7)}else if(b.hasAttribute('data-see-total')){setStep(8)}else if(b.hasAttribute('data-back-order')){setStep(6)}else if(b.hasAttribute('data-back-tip')){setStep(7)}else if(b.hasAttribute('data-tip')){selectedTip=Number(b.getAttribute('data-tip'));render()}else if(b.hasAttribute('data-done')){setStep(9)}};
root.oninput=function(e){if(e.target.id==='dishSearch'){query=e.target.value;var pos=query.length;render();var input=document.getElementById('dishSearch');input.focus();input.setSelectionRange(pos,pos)}if(e.target.id==='taxInput'){taxRate=Math.max(0,Math.min(20,Number(e.target.value)||0));var taxBox=document.querySelector('.tax-callout p');if(taxBox)taxBox.innerHTML='<b>'+copy('estimatedTax')+' ('+taxRate+'%)</b><br>'+money(tax());var totalBox=document.querySelector('.summary-row.total strong');if(totalBox)totalBox.textContent=money(subtotal()+tax())}if(e.target.id==='customTipInput'){customTip=Math.max(0,Math.min(100,Number(e.target.value)||0));selectedTip='custom';var card=e.target.closest('.tip-option');card.classList.add('active');var amount=card.querySelector('span');if(amount)amount.textContent=money(subtotal()*customTip/100)}};
document.querySelector('[data-home]').onclick=function(){setStep(1)};document.getElementById('globalLanguage').onchange=function(e){setLang(e.target.value)};
document.getElementById('cameraInput').onchange=function(e){upload(e.target.files[0]);e.target.value=''};
document.getElementById('photoInput').onchange=function(e){upload(e.target.files[0]);e.target.value=''};
root.onchange=function(e){if(e.target.id==='taxInput'||e.target.id==='customTipInput')render()};document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modal){modal=null;renderModal()}});
}
function initLanguage(){var select=document.getElementById('globalLanguage');select.innerHTML=languages.map(function(l){return '<option value="'+l[0]+'">'+l[2]+'</option>'}).join('');}
document.getElementById('modalRoot').onclick=function(e){if(e.target.closest('[data-close-modal]')){modal=null;renderModal()}};
initLanguage();events();render();
})();
</script>
</body>
</html>
